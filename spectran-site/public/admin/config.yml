backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Товары"
    folder: "src/content/products"
    create: true
    slug: "{{name}}"
    format: "json"
    extension: "json"
    identifier_field: "name"
    fields:
      - { label: "Название", name: "name", widget: "string" }
      - { label: "Категория", name: "categoryId", widget: "relation", collection: "categories", search_fields: ["name"], value_field: "{{slug}}", display_fields: ["name"] }
      - { label: "Подкатегория", name: "subcategoryId", widget: "relation", collection: "subcategories", search_fields: ["name"], value_field: "{{slug}}", display_fields: ["name"], required: false }
      - { label: "Краткое описание", name: "shortDescription", widget: "text" }
      - { label: "Полное описание", name: "fullDescription", widget: "markdown" }
      - { label: "Изображения", name: "images", widget: "list", field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Лидер продаж", name: "isBestseller", widget: "boolean", required: false }
      - name: "specifications"
        label: "Характеристики"
        widget: "list"
        fields:
          - { label: "ID", name: "id", widget: "string" }
          - { label: "Название", name: "name", widget: "string" }
          - { label: "Значение", name: "value", widget: "string" }

  - name: "categories"
    label: "Категории"
    folder: "src/content/categories"
    create: true
    slug: "{{name}}"
    format: "json"
    extension: "json"
    identifier_field: "name"
    fields:
      - { label: "Название", name: "name", widget: "string" }
      - { label: "Описание", name: "description", widget: "string", required: false }

  - name: "subcategories"
    label: "Подкатегории"
    folder: "src/content/subcategories"
    create: true
    slug: "{{name}}"
    format: "json"
    extension: "json"
    identifier_field: "name"
    fields:
      - { label: "Родительская категория", name: "categoryId", widget: "relation", collection: "categories", search_fields: ["name"], value_field: "{{slug}}", display_fields: ["name"] }
      - { label: "Название", name: "name", widget: "string" }
